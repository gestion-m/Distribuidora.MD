<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de Ventas</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14150f;--paper:#eef0ea;--card:#fff;--line:#d9d6c7;--muted:#6b6f63;--gold:#c6ff2e;--coral:#e8543a;--green:#3f7d4f;--bar:#14150f;--barink:#eef0ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#eef0ea;--paper:#14150f;--card:#1f2117;--line:#3a3c31;--muted:#a3a698;--green:#7fd08f;--bar:#0b0c07}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:15px}
h1,h2,h3{font-family:'Anton',Impact,sans-serif;font-weight:400;letter-spacing:.01em;margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--barink);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.top h1{font-size:1.2rem}.top small{color:var(--gold);font-weight:600;font-size:.7rem}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:10}
nav{display:flex;gap:6px;padding:12px 14px 0;overflow-x:auto}
nav button{flex:1;white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;font-weight:600;font-size:.8rem;font-family:inherit}
nav button.on{background:var(--gold);color:#14150f;border-color:var(--gold)}
main{padding:14px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{font-size:1.25rem;margin-bottom:10px}
label{display:block;font-size:.72rem;font-weight:600;color:var(--muted);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:10px;padding:11px 14px;font-weight:700;font-family:inherit;margin-top:10px;cursor:pointer}
.btn.g{background:var(--gold);color:#14150f}.btn.s{padding:6px 10px;margin:0;font-size:.75rem}.btn.x{background:transparent;color:var(--coral);border:1px solid var(--coral)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{border:2px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.opt.best{border-color:var(--green)}
.opt .n{font-size:.75rem;color:var(--muted);font-weight:600}
.opt .c{font-family:'Anton',sans-serif;font-size:1.45rem;margin:4px 0}
.opt .t{font-size:.7rem;color:var(--muted)}
.big{font-family:'Anton',sans-serif;font-size:1.6rem}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--card)}
.kpi span{font-size:.68rem;color:var(--muted);font-weight:600;display:block}
.kpi b{font-family:'Anton',sans-serif;font-size:1.25rem;font-weight:400}
.pos{color:var(--green)}.neg{color:var(--coral)}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}.item small{color:var(--muted);display:block}
.tag{white-space:nowrap;font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--line)}
.tag.late{background:var(--coral);color:#fff}.tag.ok{background:var(--green);color:#fff}
.note{font-size:.72rem;color:var(--muted);margin-top:8px}
#sync{font-size:.7rem}
.wa{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px #0005;z-index:20}
details.acc>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
details>summary::-webkit-details-marker{display:none}
details.acc>summary h2{margin:0}
details>summary::after{content:'▾';font-size:1.1rem;color:var(--muted);transition:transform .15s}
details[open]>summary::after{transform:rotate(180deg)}
details.acc[open]>summary{margin-bottom:10px}
details.sub{border-top:1px solid var(--line);margin-top:10px;padding-top:2px}
details.sub>summary{cursor:pointer;font-weight:700;font-size:.85rem;padding:10px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.chips button{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 12px;font-weight:600;font-size:.78rem;font-family:inherit}
.chips button.on{background:var(--gold);color:#14150f;border-color:var(--gold)}
.cmp{display:grid;grid-template-columns:.7fr 1fr 1fr;gap:6px;align-items:stretch}
.cmp .h{font-size:.66rem;font-weight:700;text-align:center;padding:6px 2px;color:var(--muted)}
.cmp .n{font-weight:700;font-size:.8rem;display:flex;align-items:center}
.cmp .ca,.cmp .cx{border:2px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.cmp .ca{border-color:var(--green)}.cmp .cx{border-color:var(--gold)}
.cmp b{font-family:'Anton',sans-serif;font-weight:400;font-size:1.15rem;display:block}
.cmp small{display:block;font-size:.65rem;color:var(--muted)}
#crb{position:absolute;border:2px solid var(--gold);box-shadow:0 0 0 9999px #0009;cursor:move;touch-action:none}
#crb i{position:absolute;width:36px;height:36px;touch-action:none}
#crb i::after{content:"";position:absolute;width:16px;height:16px;background:var(--gold);border-radius:3px}
#crb i[data-h=nw]{left:0;top:0}#crb i[data-h=nw]::after{left:0;top:0}
#crb i[data-h=ne]{right:0;top:0}#crb i[data-h=ne]::after{right:0;top:0}
#crb i[data-h=sw]{left:0;bottom:0}#crb i[data-h=sw]::after{left:0;bottom:0}
#crb i[data-h=se]{right:0;bottom:0}#crb i[data-h=se]::after{right:0;bottom:0}
.vic{background:var(--green);color:#000;border:0;border-radius:50%;width:40px;height:40px;font-size:1.25rem;cursor:pointer;position:relative;line-height:1;padding:0}.vic.ok::after{content:'⭐';position:absolute;right:-5px;top:-6px;font-size:.8rem}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-width:0}
.pt .im{aspect-ratio:1;width:100%;border-radius:8px;background:var(--paper);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:1.6rem}
.pt .im img{width:100%;height:100%;object-fit:cover;display:block}
.pt b{font-size:.72rem;line-height:1.2;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.4em}
.pt span{font-family:'Anton',sans-serif;font-size:.95rem}
.pt small{font-size:.62rem;color:var(--muted);margin-top:-3px}
.pms{position:fixed;inset:0;background:#000a;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.pmb{background:var(--paper);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
@media print{.pms,.top,nav,.noprint,.wa,button,body::before{display:none!important}body{background:#fff;color:#000}main{max-width:none;padding:0}.card{break-inside:avoid;border-color:#999;background:#fff}}
.pkb{width:100%;display:flex;gap:10px;align-items:center;text-align:left;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px;font:inherit;cursor:pointer}
.pkb .pki{width:52px;height:52px;border-radius:8px;overflow:hidden;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex:none}
.pkb .pki img{width:100%;height:100%;object-fit:cover}
.pkb span:nth-child(2){flex:1;min-width:0}.pkb b{display:block;font-size:.85rem}.pkb small{color:var(--muted);font-size:.7rem}
.spec{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:6px 0 8px;font-size:.82rem}.spec dt{color:var(--muted);font-weight:600}.spec dd{margin:0;font-weight:600}
</style>
</head>

<script>
const TABS=[['cuotas','Cuotas'],['prod','Productos'],['ventas','Ventas'],['cli','Clientes'],['gan','Ganancias'],['ped','Pedidos'],['cat','Link cliente']];
/* ====== PEGÁ ACÁ TU CONFIG DE FIREBASE (Configuración del proyecto > Tus apps > Web). Ejemplo: {apiKey:"...",authDomain:"...",projectId:"...",appId:"..."} ====== */
const FIREBASE_CONFIG={apiKey:"AIzaSyA7oAT5mcof11abtCUIFDTSJI2b9R141zQ",authDomain:"distribuidora-md-f9f95.firebaseapp.com",projectId:"distribuidora-md-f9f95",storageBucket:"distribuidora-md-f9f95.firebasestorage.app",messagingSenderId:"269066695927",appId:"1:269066695927:web:2ec3d47754f910ca934ff2"};
const ADMINS=['joha461@gmail.com','damianirala0727@gmail.com']; // emails que pueden entrar al panel, ej: ['vos@mail.com','hermana@mail.com']
let fotoIA='';
const G={per:'todo',desde:'',hasta:'',pid:''};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function gFilter(){const n=new Date(),y=n.getFullYear(),m=n.getMonth();let a='',b='',lb='Todo el período';
  if(G.per==='mes'){a=ymd(new Date(y,m,1));b=ymd(new Date(y,m+1,0));lb='Este mes'}
  else if(G.per==='mesant'){a=ymd(new Date(y,m-1,1));b=ymd(new Date(y,m,0));lb='Mes pasado'}
  else if(G.per==='30d'){a=ymd(new Date(y,m,n.getDate()-29));b=ymd(n);lb='Últimos 30 días'}
  else if(G.per==='anio'){a=y+'-01-01';b=y+'-12-31';lb='Este año'}
  else if(G.per==='rango'){a=G.desde;b=G.hasta;lb='Del '+(a||'inicio')+' al '+(b||'hoy')}
  const inR=d=>(!a||d>=a)&&(!b||d<=b),p=S.products.find(x=>x.id===G.pid);
  return{label:lb+(p?' · '+p.name:''),
    sales:S.sales.filter(v=>inR(v.date||'')&&(!G.pid||v.pid===G.pid)),
    expenses:G.pid?[]:S.expenses.filter(e=>inR(e.date||'')),
    leads:S.leads.filter(l=>inR(ymd(new Date(l.createdAt||0)))&&(!p||l.product===p.name))}}
function gTot(F){const sm=f=>F.sales.reduce((a,v)=>a+f(v),0),cob=sm(cobrado),cst=sm(v=>v.cost),tot=sm(v=>v.total),gas=F.expenses.reduce((a,e)=>a+e.amount,0),aseg=sm(v=>Math.max(0,cobrado(v)-v.cost));
  return{cob,cst,tot,calle:tot-cob,aseg,gas,esperada:tot-cst-gas,neta:aseg-gas,atr:F.sales.filter(late).length}}
function gProd(F){const m={};F.sales.forEach(v=>{const k=v.pname||'(sin nombre)',o=m[k]||(m[k]={n:k,u:0,ing:0,cob:0,aseg:0,gane:0});o.u++;o.ing+=v.total;o.cob+=cobrado(v);o.aseg+=Math.max(0,cobrado(v)-v.cost);o.gane+=v.total-v.cost});return Object.values(m).sort((a,b)=>b.u-a.u||b.ing-a.ing)}
function gPed(F){const m={};F.leads.forEach(l=>{const k=l.product||'(sin producto)';m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function gCuo(F){const m={};F.sales.forEach(v=>m[v.n]=(m[v.n]||0)+1);return Object.entries(m).sort((a,b)=>b[1]-a[1])}
async function gXls(){const F=gFilter(),T=gTot(F);
  try{if(!window.XLSX)await new Promise((ok,no)=>{const t=document.createElement('script');t.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';t.onload=ok;t.onerror=no;document.head.appendChild(t)})}catch(e){alert('No se pudo cargar el generador de Excel. Revisá tu conexión e intentá de nuevo.');return}
  const wb=XLSX.utils.book_new(),add=(n,r)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),n);
  add('Resumen',[['Período',F.label],[],['Ya cobrado',T.cob],['Plata en la calle',T.calle],['Costo de lo vendido',T.cst],['Gastos',T.gas],['Ganancia asegurada (neta)',T.neta],['Ganancia esperada al cobrar todo',T.esperada],['Ventas',F.sales.length],['Clientes con atraso',T.atr]]);
  add('Ventas',[['Fecha','Cliente','Teléfono','Producto','Cuotas','Total','Anticipo','Cuotas pagas','Cobrado','Saldo','Costo','Ganancia asegurada']].concat(F.sales.map(v=>[v.date||'',v.client,v.phone||'',v.pname,v.n,v.total,v.anticipo||0,v.paid,Math.round(cobrado(v)),Math.round(v.total-cobrado(v)),v.cost,Math.round(Math.max(0,cobrado(v)-v.cost))])));
  add('Por producto',[['Producto','Ventas','Vendido','Cobrado','Ganancia asegurada','Ganancia esperada']].concat(gProd(F).map(x=>[x.n,x.u,x.ing,Math.round(x.cob),Math.round(x.aseg),Math.round(x.gane)])));
  add('Pedidos de clientes',[['Producto','Pedidos']].concat(gPed(F)));
  add('Gastos',[['Fecha','Detalle','Monto']].concat(F.expenses.map(e=>[e.date||'',e.desc,e.amount])));
  XLSX.writeFile(wb,'ganancias_'+ymd(new Date())+'.xlsx')}
const NOTIFY_URL='https://avisos.joha461.workers.dev'; // ← dirección del worker de avisos (Cloudflare), ej: 'https://avisos.tuusuario.workers.dev'
async function notifyLead(t){try{if(!NOTIFY_URL||!fb||!fb.auth.currentUser)return;await fetch(NOTIFY_URL,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+await fb.auth.currentUser.getIdToken()},body:JSON.stringify({text:t})})}catch(e){}}
const FICHA_URL='https://ficha.joha461.workers.dev'; // ← dirección del worker "ficha" (Cloudflare) que busca fichas técnicas en internet
async function fichaWeb(name,cat){if(!FICHA_URL)throw new Error('config');if(!fb||!fb.auth.currentUser)throw new Error('login');const r=await fetch(FICHA_URL,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+await fb.auth.currentUser.getIdToken()},body:JSON.stringify({name:dn(name),cat})});if(r.status===429)throw new Error('cuota');if(!r.ok){let c=r.status;try{const q=await r.json();if(q&&q.error)c=q.error}catch(x){}throw new Error('ia:'+c)}const j=await r.json();return String(j.text||'').trim()}
const fichaErr=e=>e.message==='config'?'Todavía no está activada la búsqueda con IA (falta el paso del worker de fichas). Mientras tanto usá «Agregar ficha técnica» y completá los datos a mano.':e.message==='cuota'?'Se acabó el cupo gratis de hoy. Probá mañana.':'No se pudo buscar la ficha. Probá de nuevo en un momento.'+(String(e.message).startsWith('ia:')?' (código: '+String(e.message).slice(3)+')':'');
function mergeSpecTxt(cur,add){const L=String(cur||'').split('\n'),idx={};L.forEach((l,i)=>{if(l.includes(':'))idx[nz(l.split(':')[0]).trim()]=i});
  String(add||'').split('\n').forEach(l=>{const m=l.match(/^\s*[-•*]?\s*([^:]{2,30}):\s*(.+)$/);if(!m)return;const lab=m[1].replace(/\*+/g,'').trim(),val=m[2].replace(/\*+/g,'').replace(/\[\d+(,\s*\d+)*\]/g,'').trim(),k=nz(lab);if(!val)return;
    if(idx[k]!=null){const cl=L[idx[k]];if(!cl.slice(cl.indexOf(':')+1).trim())L[idx[k]]=lab+': '+val}else{idx[k]=L.length;L.push(lab+': '+val)}});
  return L.filter(l=>l.trim()).join('\n')}
let _bulk=false;
async function bulkFichas(){const bt=()=>$('pbulk')||{},ms=()=>$('pbm')||{};if(_bulk){_bulk=false;return}
  const has=p=>/^[^:\n]{2,30}:\s*\S/m.test(p.desc||''),L=S.products.filter(p=>!has(p));
  if(!L.length){ms().textContent='Todos los productos ya tienen ficha.';return}
  if(!confirm('Voy a buscar en internet la ficha de '+L.length+' producto(s) que no tienen. Tarda unos segundos por producto. ¿Seguimos?'))return;
  _bulk=true;bt().textContent='⏹ Detener';let ok=0,bad=0,why='';
  for(let i=0;i<L.length&&_bulk;i++){const p=L[i];ms().textContent='🔎 '+(i+1)+'/'+L.length+': '+dn(p.name)+'…';
    try{const t=await fichaWeb(p.name,catOf(p)),cur=S.products.find(x=>x.id===p.id)||p,m=mergeSpecTxt(cur.desc,t);if(has({desc:m})){await put('products',{...cur,desc:m});ok++}else bad++}
    catch(e){bad++;if(e.message==='cuota'||e.message==='config'){why=e.message;break}}
    await new Promise(r=>setTimeout(r,6500))}
  const stopped=!_bulk;_bulk=false;bt().textContent='🔎 Completar fichas de todos los productos (IA)';
  ms().textContent=(why==='cuota'?'Se acabó el cupo gratis de hoy: seguí mañana. ':why==='config'?'Falta configurar FICHA_URL. ':stopped?'Detenido. ':'Listo. ')+'Completados: '+ok+(bad?' · sin datos: '+bad:'')+'. Revisá las fichas: pueden tener errores.'}
const IA_URL='https://ia-ventas.joha461.workers.dev'; // ← acá va la dirección de tu servidor de IA (Cloudflare), ej: 'https://ia-ventas.algo.workers.dev'
let tab='cuotas', fb=null;
const S={config:{recargo:.03,colchon:.07,anticipo:.4},products:[],sales:[],expenses:[],leads:[],receipts:[],vipReq:[],vipOk:[]};
const $=id=>document.getElementById(id);
const money=n=>(Number(n)||0).toLocaleString('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num=id=>Number($(id).value)||0;

/* ---------- datos: Firebase (en vivo) o locales ---------- */
try{const l=JSON.parse(localStorage.getItem('cv')||'null');if(l)Object.assign(S,l)}catch(e){}
function localSave(){try{localStorage.setItem('cv',JSON.stringify(S))}catch(e){}}
const vipDoc=p=>({n:p.name,fv:Object.fromEntries(NS.map(n=>[n,financed(p,n,true)]))});
const pubDoc=p=>({n:p.name,k:Math.round(contado(p)/100)*100,f:Object.fromEntries(NS.map(n=>[n,financed(p,n)])),ph:p.photo||'',ds:p.desc||'',d:p.stock>0,c:catOf(p),b:brandOf(p)});
async function pub(list){if(!fb)return;const{doc,setDoc}=fb.fs;try{await setDoc(doc(fb.db,'catalog','_cfg'),{w:S.config.wa||'',a:S.config.anticipo,pm:S.config.promoMin||5,alias:S.config.alias||'',titular:S.config.titular||''});for(const p of list){await setDoc(doc(fb.db,'catalog',p.id),pubDoc(p));try{await setDoc(doc(fb.db,'vip',p.id),vipDoc(p))}catch(e){}}}catch(e){$('sync').textContent='Error al publicar catálogo'}}
const _th={};
async function thumb(u,m=640,q=.7){if(!u)return '';const k=u.length+':'+u.slice(-24);if(_th[k])return _th[k];try{const i=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=u}),z=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(i.width*z));c.height=Math.max(1,Math.round(i.height*z));c.getContext('2d').drawImage(i,0,0,c.width,c.height);return _th[k]=c.toDataURL('image/jpeg',q)}catch(e){return ''}}
const maskDni=d=>{const x=String(d||'').replace(/\D/g,'');return x?'••.•••.'+x.slice(-3):''};

    <label>Stock</label><input id="es" type="number" value="${p.stock}">
    <label>Descripción y ficha técnica (una línea por dato, ej. «Cámara frontal: 8 MP»)</label><textarea id="edd" rows="7">${esc(p.desc||'')}</textarea><button class="btn s" id="etpl" type="button">📋 Agregar ficha técnica</button> <button class="btn s g" id="efw" type="button">🔎 Buscar ficha en internet (IA)</button><p class="note" id="efm" style="margin:4px 0"></p>
    <label>Foto</label><div id="efp"></div><input id="eff" type="file" accept="image/*">
    <label>Estilo de la foto con IA</label><select id="eest"><option value="estudio">Fondo de estudio</option><option value="ambiente">En un ambiente</option><option value="modelo">Con una modelo</option></select>
    <button class="btn" id="emej" type="button" style="margin-top:8px">✨ Mejorar foto con IA</button><div id="eprev" style="margin-top:8px"></div><p class="note" id="emsg"></p>
    <button class="btn g" id="esv" type="button" style="width:100%">Guardar cambios</button>`);
  distBind('ed');catBind('ecat');$('etpl').onclick=()=>{const ch=addTpl('edd',$('en').value,$('ecat').value||guessCat($('en').value));$('efm').textContent=ch?'✔ Agregué las líneas de la ficha (y los datos que se leen del nombre). Completá lo que falte o usá 🔎 Buscar ficha en internet.':'Ya estaban todas las líneas. Completá los datos vacíos o usá 🔎 Buscar ficha en internet.'};
  $('efw').onclick=async()=>{const n=$('en').value.trim(),b=$('efw');if(!n)return;b.disabled=true;b.textContent='🔎 Buscando…';try{const t=await fichaWeb(n,$('ecat').value||guessCat(n));$('edd').value=mergeSpecTxt($('edd').value,t);$('efm').textContent=t?'✔ Ficha completada desde internet. Revisala y tocá "Guardar cambios".':'No encontré datos de ese producto.'}catch(e){$('efm').textContent=fichaErr(e)}b.disabled=false;b.textContent='🔎 Buscar ficha en internet (IA)'};const show=()=>{$('efp').innerHTML=foto?`<img src="${foto}" alt="" style="width:100%;max-height:220px;object-fit:contain;border-radius:12px;background:var(--paper)">`:'<p class="note">Sin foto.</p>'};show();
  const byCost=()=>{ult='m';$('ep').value=Math.round(num('ec')*(1+num('em')/100))};
  $('ec').oninput=byCost;$('em').oninput=byCost;
  $('ep').oninput=()=>{ult='p';const c=num('ec');if(c>0)$('em').value=+((num('ep')/c-1)*100).toFixed(2)};
  $('eff').onchange=async()=>{file=$('eff').files[0];if(!file)return;{const cc=await cropImage(file);if(!cc){$('eff').value='';file=null;return}file=cc}try{foto=await shrink(file);show();$('eprev').innerHTML=''}catch(e){$('emsg').textContent='No pude leer esa foto.'}};
  $('emej').onclick=async()=>{const bt=$('emej'),pv=$('eprev');if(!foto){$('emsg').textContent='Primero cargá una foto.';return}
    if(!(fb&&fb.fn)){$('emsg').textContent='La IA todavía no está configurada.';return}
    bt.disabled=true;pv.innerHTML='';$('emsg').textContent='✨ Armando la foto profesional… puede tardar hasta 1 minuto.';
    try{const src=file?await shrink(file,1024,.85):foto,r=await ia('foto',{img:src,nombre:$('en').value.trim(),estilo:$('eest').value},120000);if(!r.img)throw new Error(r.error||'ia');
      pv.innerHTML=`<img src="${r.img}" alt="" style="width:100%;border-radius:12px;display:block"><div class="row" style="margin-top:8px"><button class="btn g" id="eok" type="button">Usar esta foto</button><button class="btn" id="eno" type="button">Descartar</button></div>`;
      $('eok').onclick=async()=>{foto=await shrink(await (await fetch(r.img)).blob());pv.innerHTML='';show();$('emsg').textContent='✔ Foto con IA elegida: se guarda con "Guardar cambios".'};
      $('eno').onclick=()=>{pv.innerHTML='';$('emsg').textContent='Descartada.'};$('emsg').textContent='Mirá bien el resultado (logo y color) antes de usarla.'}
    catch(e){$('emsg').textContent='No se pudo mejorar la foto: '+(e.name==='AbortError'?'tardó demasiado, probá de nuevo.':String(e.message||'error').slice(0,200))}
    finally{bt.disabled=false}};
  $('esv').onclick=()=>{const n=$('en').value.trim(),c=num('ec');if(!n||!c){$('emsg').textContent='Falta el nombre o el costo.';return}
    const m=ult==='p'&&c>0?(num('ep')/c-1)*100:num('em');
    put('products',{...p,name:n,dist:$('ed').value.trim(),cat:$('ecat').value,brand:$('ebr').value.trim(),cost:c,margin:m,stock:num('es'),desc:$('edd').value.trim(),photo:foto});$('iam').remove()}}
function iaModal(t,h){let m=$('iam');if(m)m.remove();m=document.createElement('div');m.id='iam';
  m.style.cssText='position:fixed;inset:0;z-index:50;background:#0009;display:flex;align-items:flex-end;justify-content:center';
  m.innerHTML=`<div class="card" style="width:100%;max-width:760px;max-height:85vh;overflow:auto;margin:0;border-radius:16px 16px 0 0"><h2>${t}</h2><div id="iab">${h}</div><button class="btn x" id="iax">Cerrar</button></div>`;
  document.body.appendChild(m);$('iax').onclick=()=>m.remove();return $('iab')}
const iaErr='<p class="neg">No se pudo usar la IA ahora. Probá de nuevo.</p>';
const iaBtn=(txt,attr,fn)=>{const c=document.createElement('button');c.className='btn s';c.setAttribute(attr,'1');c.textContent=txt;c.onclick=fn;return c};
const iaDias=x=>late(x)?daysLate(nextDue(x)):0;
const iaItem=(x,i)=>({i,nombre:x.client.split(' ')[0],producto:x.pname,nro:x.paid+1,de:x.n,monto:Math.round(cuotaOf(x)),vence:iso(nextDue(x)),dias:iaDias(x),link:x.tok?payLink(x.tok):'',alias:S.config.alias||''});

/* 1) Cobranza de una venta */
async function iaCobro(x){
  const b=iaModal('✨ MENSAJE DE COBRANZA','<p class="note">Escribiendo…</p>');
  try{const r=await ia('cobranza',iaItem(x,0));
    b.innerHTML=`<textarea id="iat" rows="7">${esc(r.text)}</textarea><p class="note">Revisalo y editalo antes de mandarlo.</p>${x.phone?'<button class="btn g" id="iaw">Abrir en WhatsApp</button>':''}`;
    if($('iaw'))$('iaw').onclick=()=>window.open('https://wa.me/'+e164g(x.phone).slice(1)+'?text='+encodeURIComponent($('iat').value))
  }catch(e){b.innerHTML=iaErr}
}

/* 2) Cobranzas de hoy (todas juntas) */
async function iaHoy(){
  const b=iaModal('✨ COBRANZAS DE HOY','<p class="note">Preparando los mensajes…</p>');
  const fin=new Date();fin.setDate(fin.getDate()+(S.config.avisoDias??1));fin.setHours(23,59,59,999);
  const L=S.sales.filter(x=>x.paid<x.n&&nextDue(x)<=fin&&x.phone).sort((a,b)=>nextDue(a)-nextDue(b)).slice(0,10);
  if(!L.length){b.innerHTML='<p>Hoy no hay cuotas vencidas ni por vencer (con teléfono cargado). 🎉</p>';return}
  try{const r=await ia('cobranza_lote',{items:L.map(iaItem)});
    b.innerHTML=L.map((x,i)=>{const m=((r.items||[]).find(v=>v.i===i)||{}).text||'',d=iaDias(x);
      return `<div class="item" style="display:block"><b>${esc(x.client)}</b> <span class="tag ${d>0?'late':''}">${d>0?'Atrasado '+d+' d':'Vence hoy'}</span><small>${esc(x.pname)} · cuota ${x.paid+1}/${x.n} · ${money(cuotaOf(x))}</small><textarea rows="5" id="ih${i}" style="margin:6px 0">${esc(m)}</textarea><button class="btn s g" data-w="${i}">Abrir en WhatsApp</button></div>`}).join('')+'<p class="note">Máximo 10 por vez, los más atrasados primero. Revisá cada mensaje antes de enviar.</p>';
    b.querySelectorAll('[data-w]').forEach(btn=>btn.onclick=()=>{const i=+btn.dataset.w;window.open('https://wa.me/'+e164g(L[i].phone).slice(1)+'?text='+encodeURIComponent($('ih'+i).value))})
  }catch(e){b.innerHTML=iaErr}
}

/* 3) Revisar comprobante */
async function iaComp(rid){
  const r=S.receipts.find(v=>v.id===rid),x=r&&S.sales.find(v=>v.tok===r.sid);if(!x)return;
  const b=iaModal('✨ REVISIÓN DE COMPROBANTE','<p class="note">Leyendo la imagen…</p>');
  try{const o=await ia('comprobante',{img:r.img,esperado:Math.round(cuotaOf(x)),alias:S.config.alias||'',titular:S.config.titular||''});
    if(!o.json){b.innerHTML='<p>'+esc(o.text||'Sin resultado')+'</p>';return}
    const j=o.json,ok=v=>v===true?'✔':v===false?'✘':'?';
    b.innerHTML=`<div class="kpis"><div class="kpi"><span>Monto leído</span><b>${j.monto==null?'—':money(j.monto)} ${ok(j.coincide_monto)}</b></div><div class="kpi"><span>Esperado</span><b>${money(cuotaOf(x))}</b></div><div class="kpi"><span>Fecha</span><b>${esc(j.fecha||'—')}</b></div><div class="kpi"><span>Destino ${ok(j.coincide_destino)}</span><b style="font-size:.9rem">${esc(j.destino||'—')}</b></div></div>
    <p style="margin-top:10px">${esc(j.resumen||'')}</p>${(j.alertas||[]).map(a=>`<p class="neg">⚠ ${esc(a)}</p>`).join('')}
    <p class="note">La IA solo lee la imagen: no confirma que la plata haya entrado. Chequeá siempre tu cuenta antes de aprobar.</p>`
  }catch(e){b.innerHTML=iaErr}
}

/* 4) Análisis de ventas */
async function iaAnalisis(){
  const b=iaModal('✨ ANÁLISIS DEL NEGOCIO','<p class="note">Analizando tus datos…</p>');
  const by={};S.sales.forEach(s=>{const o=by[s.pname]=by[s.pname]||{ventas:0,total:0,costo:0,cobrado:0,atrasadas:0};o.ventas++;o.total+=s.total;o.costo+=s.cost;o.cobrado+=Math.round(cobrado(s));if(late(s))o.atrasadas++});
  const cuotas={};S.sales.forEach(s=>cuotas[s.n]=(cuotas[s.n]||0)+1);
  try{const r=await ia('analisis',{resumen:{productos:S.products.map(p=>({n:p.name,costo:p.cost,margen:p.margin,stock:p.stock})),ventasPorProducto:by,ventasPorCantidadDeCuotas:cuotas,gastos:S.expenses.reduce((a,e)=>a+e.amount,0),config:{recargoMensual:S.config.recargo,colchon:S.config.colchon,anticipo:S.config.anticipo}}});
    b.innerHTML='<div style="white-space:pre-wrap">'+esc(r.text)+'</div><p class="note">Es una ayuda para pensar, no una verdad: decidís vos.</p>'
  }catch(e){b.innerHTML=iaErr}
}

/* 5) Chat en el catálogo del cliente */
function iaChat(){
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<h2>✨ PREGUNTALE A LA IA</h2><div id="icm" style="max-height:260px;overflow:auto;margin-bottom:8px"></div><div class="row" style="grid-template-columns:1fr auto"><input id="ici" placeholder="Ej: ¿cuál me conviene en 6 cuotas?"><button class="btn g" id="icb" style="margin:0">Enviar</button></div><p class="note">Asistente automático: puede equivocarse. Valen los precios del catálogo.</p>`;
  $('app').insertBefore(c,$('lead'));
  const hist=[],draw=()=>{$('icm').innerHTML=hist.map(m=>`<p style="margin:6px 0;${m.role==='user'?'text-align:right;color:var(--muted)':''}">${esc(m.content)}</p>`).join('');$('icm').scrollTop=1e9};
  const send=async()=>{const t=$('ici').value.trim();if(!t)return;$('ici').value='';hist.push({role:'user',content:t});draw();$('icb').disabled=true;
    try{const r=await ia('chat',{msgs:hist,ap:Number($('cap').value)});hist.push({role:'assistant',content:r.text})}
    catch(e){hist.push({role:'assistant',content:'No pude responder ahora. Escribinos por WhatsApp.'})}
    $('icb').disabled=false;draw()};
  $('icb').onclick=send;$('ici').onkeydown=e=>{if(e.key==='Enter')send()};
}

/* Enganches: agregan los botones de IA después de cada refresh */
function iaHooks(){
  document.querySelectorAll('[data-ds]').forEach(b=>{const x=S.sales.find(v=>v.id===b.dataset.ds);
    if(!x||x.paid>=x.n||b.parentNode.querySelector('[data-ia]'))return;
    b.parentNode.insertBefore(iaBtn('✨ Cobranza','data-ia',()=>iaCobro(x)),b)});
  document.querySelectorAll('[data-ok]').forEach(b=>{if(b.parentNode.querySelector('[data-iar]'))return;
    b.parentNode.insertBefore(iaBtn('✨ Revisar con IA','data-iar',()=>iaComp(b.dataset.ok)),b)});
  const cb=$('cbanner');if(cb&&!cb.querySelector('[data-iah]')){const c=iaBtn('✨ Cobranzas de hoy','data-iah',iaHoy);c.classList.add('g');c.style.marginBottom='6px';cb.appendChild(c)}
  const g=$('gres');if(g&&!g.querySelector('[data-ian]')){const c=iaBtn('✨ Analizar con IA','data-ian',iaAnalisis);c.classList.add('g');g.appendChild(c)}
}
let _rs=0,_pp=0;const _refresh=refresh;refresh=function(){_refresh();if(fb&&fb.fn)iaHooks();
  if(!_pp&&fb&&fb.auth&&fb.auth.currentUser&&S.sales.length&&S.products.length){_pp=1;S.sales.forEach(pubPay)}
  if(!_rs&&fb&&fb.auth.currentUser&&S.sales.length&&!$('iam')){_rs=1;try{const t=iso(new Date());if(localStorage.getItem('remd')!==t&&remItems().length){localStorage.setItem('remd',t);remModal()}}catch(e){}}};

/* ==================== FIN INTELIGENCIA ARTIFICIAL ==================== */

(async()=>{
  const cm=/^#catalogo/.test(location.hash)||/oobCode=/.test(location.search),pm=location.hash.match(/^#pago=(\w+)/);
  if(!FIREBASE_CONFIG){if(cm||pm){$('app').innerHTML='<div class="card">Catálogo no configurado todavía.</div>';return}$('sync').textContent='Solo en este dispositivo (falta Firebase)';build();return}
  try{const B='https://www.gstatic.com/firebasejs/10.12.2/';
    const[A,F,U]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-firestore.js'),import(B+'firebase-auth.js')]);
    const app=A.initializeApp(FIREBASE_CONFIG);fb={fs:F,au:U,db:F.getFirestore(app),auth:U.getAuth(app),fn:!!IA_URL};
  }catch(e){if(cm||pm){$('app').innerHTML='<div class="card">No se pudo conectar.</div>';return}$('sync').textContent='Sin conexión a Firebase';build();return}
  if(pm)return payView(pm[1]);
  if(cm)return catView();
  let subbed=false;
  fb.au.onAuthStateChanged(fb.auth,u=>{
    if(!u||u.phoneNumber||(ADMINS.length&&!ADMINS.includes(u.email))){loginView(u?'Esta cuenta no tiene acceso al panel':'');return}
    $('sync').textContent='● En vivo · '+u.email;$('nav').style.display='';
    if(!subbed){subbed=true;
      ['products','sales','expenses','leads','receipts'].forEach(c=>fb.fs.onSnapshot(fb.fs.collection(fb.db,c),sn=>{S[c]=sn.docs.map(x=>({...x.data(),id:x.id}));refresh()},()=>{$('sync').textContent='Sin permiso o sin conexión'}));
      ['vipReq','vipOk'].forEach(c=>fb.fs.onSnapshot(fb.fs.collection(fb.db,c),sn=>{S[c]=sn.docs.map(x=>({...x.data(),id:x.id}));refresh()},()=>{}));
      fb.fs.onSnapshot(fb.fs.doc(fb.db,'config','main'),x=>{if(x.exists()){S.config={...S.config,...x.data()};refresh()}});}
    build();
  });
})();
</script>
