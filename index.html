<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de Ventas</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14150f;--paper:#eef0ea;--card:#fff;--line:#d9d6c7;--muted:#6b6f63;--gold:#c6ff2e;--coral:#e8543a;--green:#3f7d4f;--bar:#14150f;--barink:#eef0ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#eef0ea;--paper:#14150f;--card:#1f2117;--line:#3a3c31;--muted:#a3a698;--green:#7fd08f;--bar:#0b0c07}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:15px}
h1,h2,h3{font-family:'Anton',Impact,sans-serif;font-weight:400;letter-spacing:.01em;margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--barink);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.top h1{font-size:1.2rem}.top small{color:var(--gold);font-weight:600;font-size:.7rem}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:10}
nav{display:flex;gap:6px;padding:12px 14px 0;overflow-x:auto}
nav button{flex:1;white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;font-weight:600;font-size:.8rem;font-family:inherit}
nav button.on{background:var(--gold);color:#14150f;border-color:var(--gold)}
main{padding:14px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{font-size:1.25rem;margin-bottom:10px}
label{display:block;font-size:.72rem;font-weight:600;color:var(--muted);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:10px;padding:11px 14px;font-weight:700;font-family:inherit;margin-top:10px;cursor:pointer}
.btn.g{background:var(--gold);color:#14150f}.btn.s{padding:6px 10px;margin:0;font-size:.75rem}.btn.x{background:transparent;color:var(--coral);border:1px solid var(--coral)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{border:2px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.opt.best{border-color:var(--green)}
.opt .n{font-size:.75rem;color:var(--muted);font-weight:600}
.opt .c{font-family:'Anton',sans-serif;font-size:1.45rem;margin:4px 0}
.opt .t{font-size:.7rem;color:var(--muted)}
.big{font-family:'Anton',sans-serif;font-size:1.6rem}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--card)}
.kpi span{font-size:.68rem;color:var(--muted);font-weight:600;display:block}
.kpi b{font-family:'Anton',sans-serif;font-size:1.25rem;font-weight:400}
.pos{color:var(--green)}.neg{color:var(--coral)}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}.item small{color:var(--muted);display:block}
.tag{font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--line)}
.tag.late{background:var(--coral);color:#fff}.tag.ok{background:var(--green);color:#fff}
.note{font-size:.72rem;color:var(--muted);margin-top:8px}
#sync{font-size:.7rem}
</style>
</head>
<body>
<div class="top"><h1>CONTROL DE VENTAS</h1><small id="sync">…</small></div>
<nav id="nav"></nav>
<main id="app"></main>
<script>
const TABS=[['cuotas','Cuotas'],['prod','Productos'],['ventas','Ventas'],['cli','Clientes'],['gan','Ganancias'],['ped','Pedidos'],['cat','Link cliente']];
/* ====== PEGÁ ACÁ TU CONFIG DE FIREBASE (Configuración del proyecto > Tus apps > Web). Ejemplo: {apiKey:"...",authDomain:"...",projectId:"...",appId:"..."} ====== */
const FIREBASE_CONFIG={apiKey:"AIzaSyA7oAT5mcof11abtCUIFDTSJI2b9R141zQ",authDomain:"distribuidora-md-f9f95.firebaseapp.com",projectId:"distribuidora-md-f9f95",storageBucket:"distribuidora-md-f9f95.firebasestorage.app",messagingSenderId:"269066695927",appId:"1:269066695927:web:2ec3d47754f910ca934ff2"};
const ADMINS=['joha461@gmail.com','damianirala0727@gmail.com']; // emails que pueden entrar al panel, ej: ['vos@mail.com','hermana@mail.com']
const IA_URL='https://ia-ventas.joha461.workers.dev'; // ← acá va la dirección de tu servidor de IA (Cloudflare), ej: 'https://ia-ventas.algo.workers.dev'
let tab='cuotas', fb=null;
const S={config:{recargo:.03,colchon:.07,anticipo:.4},products:[],sales:[],expenses:[],leads:[],receipts:[]};
const $=id=>document.getElementById(id);
const money=n=>(Number(n)||0).toLocaleString('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num=id=>Number($(id).value)||0;

/* ---------- datos: Firebase (en vivo) o locales ---------- */
try{const l=JSON.parse(localStorage.getItem('cv')||'null');if(l)Object.assign(S,l)}catch(e){}
function localSave(){try{localStorage.setItem('cv',JSON.stringify(S))}catch(e){}}
const pubDoc=p=>({n:p.name,k:Math.round(contado(p)/100)*100,f:Object.fromEntries(NS.map(n=>[n,financed(p,n)])),ph:p.photo||'',d:p.stock>0});
async function pub(list){if(!fb)return;const{doc,setDoc}=fb.fs;try{await setDoc(doc(fb.db,'catalog','_cfg'),{w:S.config.wa||'',a:S.config.anticipo,pm:S.config.promoMin||5,alias:S.config.alias||'',titular:S.config.titular||''});for(const p of list)await setDoc(doc(fb.db,'catalog',p.id),pubDoc(p))}catch(e){$('sync').textContent='Error al publicar catálogo'}}
async function pubPay(s){if(!fb||!s.tok)return;try{await fb.fs.setDoc(fb.fs.doc(fb.db,'pay',s.tok),{n:s.client.split(' ')[0],prod:s.pname,cuotas:s.n,paid:s.paid,cuota:Math.round(cuotaOf(s)),total:s.total,saldo:Math.round(s.total-cobrado(s)),next:s.paid<s.n?iso(nextDue(s)):''})}catch(e){}}
async function put(col,obj){
  if(col==='config'){S.config=obj}else{const i=S[col].findIndex(x=>x.id===obj.id);i<0?S[col].push(obj):S[col][i]=obj}
  if(fb){try{await fb.fs.setDoc(fb.fs.doc(fb.db,col,col==='config'?'main':obj.id),obj)}catch(e){$('sync').textContent='Error al guardar'}}else localSave();
  if(col==='products')pub([obj]);if(col==='config')pub(S.products);if(col==='sales')pubPay(obj);
  refresh();
}
async function del(col,id){
  const old=S[col].find(x=>x.id===id);
  S[col]=S[col].filter(x=>x.id!==id);
  if(fb){try{await fb.fs.deleteDoc(fb.fs.doc(fb.db,col,id));if(col==='products')await fb.fs.deleteDoc(fb.fs.doc(fb.db,'catalog',id));if(col==='sales'&&old&&old.tok)await fb.fs.deleteDoc(fb.fs.doc(fb.db,'pay',old.tok))}catch(e){}}else localSave();
  refresh();
}
function shrink(f,m=480,q=.72){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',q))};i.src=URL.createObjectURL(f)})}


/* ---------- cálculos ---------- */
const NS=[2,3,4,5,6];
const CATN=[2,3,4,5,6]; // cuotas que ve el cliente en el catálogo
/* Coeficientes base (precio contado × coeficiente = total financiado). Salen de la tabla de planes con DNI (cuota × cantidad de cuotas). El de 5 cuotas es un valor intermedio razonable: confirmalo. Podés cambiarlos desde Productos > Ajustes. */
const COEF_BASE={2:1.3034,3:1.4478,4:1.5468,5:1.70,6:1.8468}; // ADELANTADA: 1ª cuota se paga hoy
const COEF_V={2:1.3556,3:1.5333,4:1.6533,5:1.8222,6:1.95}; // VENCIDA (promo): 1ª cuota el mes que viene. Salen de la pantalla del sistema (45.000); el de 6 es estimado
const coefOf=(n,v)=>{const o=v?S.config.coefV:S.config.coef;return o&&o[n]>0?o[n]:(v?COEF_V[n]:COEF_BASE[n])||1+S.config.colchon+S.config.recargo*n/2};
const e164g=t=>{const d=String(t||'').replace(/\D/g,'');return d.startsWith('54')?'+'+d:'+549'+d};
const payLink=t=>location.href.split('#')[0].split('?')[0]+'#pago='+t;
const rtok=()=>Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(36).padStart(2,'0')).join('');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const contado=p=>p.cost*(1+p.margin/100);
const financed=(p,n,v)=>Math.round(contado(p)*coefOf(n,v)/100)*100;
const cuotaOf=s=>s.n?(s.total-s.anticipo)/s.n:0;
const cobrado=s=>s.anticipo+s.paid*cuotaOf(s);
function nextDue(s){const d=new Date(s.date+'T12:00:00');return new Date(d.getFullYear(),d.getMonth()+s.paid+(s.adel?0:1),d.getDate())}
const late=s=>s.paid<s.n&&nextDue(s)<new Date();

/* ---------- vistas ---------- */
function nav(){$('nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" data-t="${k}">${l}${k==='cli'&&S.receipts.length?' ('+S.receipts.length+')':''}</button>`).join('');
  $('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;build()})}
function prodOptions(sel){return S.products.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.name)}</option>`).join('')||'<option value="">Cargá un producto primero</option>'}

function build(){nav();const a=$('app');
  if(tab==='cuotas')a.innerHTML=`<div class="card"><h2>¿CUÁNTO SE LE VA EN CUOTAS?</h2>
    <label>Producto</label><select id="cp"></select>
    <div id="cres" style="margin-top:12px"></div>
    <p class="note">Esta pantalla se la podés mostrar al cliente: no muestra costos ni ganancias.</p></div>`;
  if(tab==='prod')a.innerHTML=`<div class="card"><h2>NUEVO PRODUCTO</h2>
    <label>Nombre</label><input id="pn" placeholder="Ventilador de pie 20&quot;">
    <div class="row"><div><label>Costo</label><input id="pc" type="number" inputmode="numeric"></div><div><label>Margen %</label><input id="pm" type="number" value="40"></div></div>
    <label>Stock (unidades)</label><input id="ps" type="number" value="1">
    <label>Foto del producto (opcional)</label><input id="pf" type="file" accept="image/*"><p class="note" id="pmsg">Subí la foto y la IA te sugiere el nombre.</p>
    <button class="btn g" id="padd">Guardar producto</button></div>
    <div class="card"><h2>MIS PRODUCTOS</h2><div id="plist"></div></div>
    <div class="card"><h2>AJUSTES DE FINANCIACIÓN</h2>
    <label>Compras previas para la promo (plan Vencida)</label><input id="spm" type="number" value="${S.config.promoMin||5}">
    <label>Alias para que te paguen</label><input id="sal" value="${esc(S.config.alias||'')}">
    <label>Titular de la cuenta</label><input id="stt" value="${esc(S.config.titular||'')}">
    <label>Coeficientes ADELANTADA: 1ª cuota hoy (contado × coef = total). Solo los ves vos</label>
    <div class="row" style="grid-template-columns:repeat(3,1fr)">${NS.map(n=>`<div><label>${n} cuotas</label><input class="cf" data-n="${n}" type="number" step="0.0001" value="${coefOf(n).toFixed(4)}"></div>`).join('')}</div>
    <label>Coeficientes VENCIDA (promo): 1ª cuota el mes que viene</label>
    <div class="row" style="grid-template-columns:repeat(3,1fr)">${NS.map(n=>`<div><label>${n} cuotas</label><input class="cv" data-n="${n}" type="number" step="0.0001" value="${coefOf(n,true).toFixed(4)}"></div>`).join('')}</div>
    <button class="btn" id="ssave">Guardar ajustes</button> <button class="btn x" id="srs">Volver a los coeficientes base</button>
    <p class="note">Ej.: 1,30 = el cliente paga 30% más que el contado en total. El cliente nunca ve estos números, solo ve el precio final. Después de cambiarlos, tocá "Guardar y publicar catálogo" en Link cliente.</p></div>`;
  if(tab==='ventas')a.innerHTML=`<div class="card"><h2>NUEVA VENTA</h2>
    <label>Cliente</label><input id="vc" placeholder="Nombre">
    <label>Teléfono</label><input id="vt" type="tel">
    <label>Producto</label><select id="vp"></select>
    <label>Plan</label><select id="vpl"><option value="a">Adelantada: paga la 1ª cuota hoy</option><option value="v">Vencida (promo): 1ª cuota el mes que viene</option></select>
    <div class="row"><div><label>Cuotas</label><select id="vn">${NS.map(c=>`<option ${c===6?'selected':''}>${c}</option>`).join('')}</select></div><div><label>Anticipo extra (opcional, $)</label><input id="va" type="number" inputmode="numeric"></div></div>
    <div id="vinfo" class="note"></div>
    <button class="btn g" id="vadd">Registrar venta</button></div>`;
  if(tab==='cli')a.innerHTML=`<div class="card"><h2>CLIENTES</h2><div id="cbanner"></div><label>Mostrar</label><select id="cf"><option value="todos">Todos</option><option value="late">Atrasados</option><option value="debe">Con deuda</option><option value="pago">Pagaron todo</option></select></div><div id="slist"></div>`;
  if(tab==='gan')a.innerHTML=`<div id="gres"></div>
    <div class="card"><h2>GASTOS (nafta, comisiones…)</h2>
    <div class="row"><div><label>Detalle</label><input id="gd"></div><div><label>Monto</label><input id="gm" type="number" inputmode="numeric"></div></div>
    <button class="btn" id="gadd">Agregar gasto</button><div id="glist" style="margin-top:10px"></div></div>`;
  if(tab==='ped')a.innerHTML=`<div class="card"><h2>PEDIDOS DE CLIENTES</h2><div id="llist"></div><p class="note">Solo llegan pedidos con el email verificado. El DNI lo verificás vos en persona: marcalo cuando lo hayas chequeado.</p></div>`;
  if(tab==='cat')a.innerHTML=`<div class="card"><h2>LINK PARA TUS CLIENTES</h2>
    <label>Tu WhatsApp (con código de país, sin + ni espacios)</label><input id="kw" placeholder="5491122334455" value="${esc(S.config.wa||'')}">
    <button class="btn g" id="kgen">Guardar y publicar catálogo</button>
    <label style="margin-top:12px">Link para compartir</label><textarea id="kout" readonly rows="2">${esc(location.href.split('#')[0])}#catalogo</textarea>
    <button class="btn" id="kcopy">Copiar link</button>
    <p class="note">El cliente ve fotos, nombres, precio de contado y cuánto paga en 3, 6 y 12 cuotas, siempre actualizado. No ve costos, márgenes ni ganancias.${fb?'':' Para que funcione falta configurar Firebase.'}</p></div>`;
  bind();refresh();
}
function catView(){
  document.title='Catálogo';$('nav').style.display='none';document.querySelector('.top h1').textContent='CATÁLOGO';$('sync').textContent='';
  $('app').innerHTML=`<div class="card"><input id="cap" type="hidden" value="0"><p style="margin:0"><b>Pagás la 1ª cuota hoy</b> y las demás una por mes, siempre del mismo valor.</p><p class="note">Los precios en cuotas incluyen el recargo por financiación.</p></div><div id="cl"><p class="note">Cargando…</p></div>
  <div class="card" id="lead"><h2>QUIERO COMPRAR</h2>
    <label>Producto</label><select id="lp2"></select>
    <label>Cuotas</label><select id="ln">${NS.map(c=>`<option ${c===6?'selected':''}>${c}</option>`).join('')}</select>
    <label>Nombre y apellido</label><input id="lnm" autocomplete="name">
    <label>DNI (sin puntos)</label><input id="ldni" inputmode="numeric" maxlength="8">
    <label>Dirección (calle, número, localidad)</label><input id="lad" autocomplete="street-address">
    <label>Celular con código de área (sin 0 ni 15)</label><input id="ltel" type="tel" placeholder="11 2233 4455">
    <label>Email</label><input id="lem" type="email" autocomplete="email">
    <div id="lstep" style="margin-top:6px"></div><p class="note neg" id="lmsg"></p><div id="recap"></div>
    <p class="note">Verificamos tu email con un link. Tus datos se usan solo para esta compra.</p></div>`;
  let items=[],cfg={a:.4,w:''},first=true;
  const sel={};
  const open={};
  const d=()=>{const pm=cfg.pm||5,
      banner=`<div class="card" style="border:2px solid var(--green)"><h2>⭐ CLIENTES FRECUENTES</h2><p style="margin:0">Si ya nos compraste <b>${pm} veces o más</b>, pagás tu <b>primera cuota recién el mes que viene</b>.</p>${cfg.w?`<a class="btn g" style="display:block;text-align:center;text-decoration:none" href="https://wa.me/${esc(cfg.w)}?text=${encodeURIComponent('Hola, soy cliente frecuente y quiero consultar por la promo')}">Consultar la promo</a>`:''}</div>`;
    const list=items.sort((a,b)=>a.n.localeCompare(b.n)).map((it,i)=>{const o=open[i];
      const rows=o?CATN.map(n=>{const f=(it.f||{})[n]||0,c=f/n,msg='Hola, me interesa: '+it.n+' en '+n+' cuotas de '+money(c)+' (pago la 1ª hoy)';
        return `<div class="item"><div><b>${n} cuotas de ${money(c)}</b><small>Hoy pagás la 1ª · Total ${money(f)}</small></div>${cfg.w?`<a class="btn s g" style="text-decoration:none" href="https://wa.me/${esc(cfg.w)}?text=${encodeURIComponent(msg)}">Elegir</a>`:''}</div>`}).join(''):'';
      return `<div class="card"><div data-o="${i}" style="cursor:pointer">${it.ph?`<img src="${it.ph}" alt="" style="width:100%;max-height:230px;object-fit:cover;border-radius:12px;margin-bottom:10px">`:''}<h2>${esc(it.n)} <span class="tag">${it.d?'En stock':'A pedido'}</span></h2><div class="kpi" style="margin:8px 0 6px"><span>Precio de contado</span><b>${money(it.k)}</b></div><p class="note" style="margin:0 0 6px"><b>${o?'▲ Ocultar cuotas':'▼ Tocá para ver las cuotas'}</b></p></div>${rows}${o&&cfg.w?'<p class="note">Tocá "Elegir" y se abre WhatsApp con tu plan para hablar con nosotros.</p>':''}</div>`}).join('');
    $('cl').innerHTML=banner+(list||'<p class="note">Todavía no hay productos.</p>');
    $('cl').querySelectorAll('[data-o]').forEach(e=>e.onclick=()=>{open[e.dataset.o]=!open[e.dataset.o];d()})};
  $('cap').oninput=d;leadInit();
  fb.fs.onSnapshot(fb.fs.collection(fb.db,'catalog'),sn=>{items=[];sn.docs.forEach(x=>x.id==='_cfg'?cfg=x.data():items.push(x.data()));
    first=false;d();fillProd(items)},()=>{$('cl').innerHTML='<p class="note">No se pudo cargar el catálogo.</p>'});
}
const LF=['lnm','ldni','lad','ltel','lem'];
function fillProd(items){const e=$('lp2');if(!e)return;const v=e.value;e.innerHTML=items.map(x=>`<option>${esc(x.n)}</option>`).join('');if(v)e.value=v}
async function leadInit(){
  const A=fb.au,v=k=>$(k).value.trim(),say=t=>{$('lmsg').textContent=t},st=h=>{$('lstep').innerHTML=h};
  let dr={},cu=null,conf=null,rv=null;try{dr=JSON.parse(localStorage.getItem('lead')||'{}')}catch(e){}
  LF.forEach(id=>{$(id).value=dr[id]||'';$(id).oninput=()=>{const o={};LF.forEach(k=>o[k]=$(k).value);try{localStorage.setItem('lead',JSON.stringify(o))}catch(e){}}});
  const val=()=>v('lnm').length<3?'Completá tu nombre y apellido':!/^\d{7,8}$/.test(v('ldni'))?'El DNI debe tener 7 u 8 números, sin puntos':v('lad').length<6?'Completá tu dirección':v('ltel').replace(/\D/g,'').length<10?'Poné tu celular con código de área (sin 0 ni 15)':!/^\S+@\S+\.\S+$/.test(v('lem'))?'El email no parece válido':'';
  const e164=t=>{const d=t.replace(/\D/g,'');return d.startsWith('54')?'+'+d:'+549'+d};
  function step(){say('');
    if(!cu||!cu.emailVerified){st('<button class="btn g" id="b1">1. Verificar mi email</button>');
      $('b1').onclick=async()=>{const e=val();if(e)return say(e);try{await A.sendSignInLinkToEmail(fb.auth,v('lem'),{url:location.href.split('#')[0].split('?')[0]+'#catalogo',handleCodeInApp:true});say('Te mandamos un link a tu email. Abrilo en este mismo celular para seguir.')}catch(x){say('No se pudo enviar el email')}}}
    else{st('<p class="note">✔ Email verificado</p><button class="btn g" id="b4">3. Enviar mi solicitud</button>');

  }catch(e){b.innerHTML=iaErr}
}

/* 3) Revisar comprobante */
async function iaComp(rid){
  const r=S.receipts.find(v=>v.id===rid),x=r&&S.sales.find(v=>v.tok===r.sid);if(!x)return;
  const b=iaModal('✨ REVISIÓN DE COMPROBANTE','<p class="note">Leyendo la imagen…</p>');
  try{const o=await ia('comprobante',{img:r.img,esperado:Math.round(cuotaOf(x)),alias:S.config.alias||'',titular:S.config.titular||''});
    if(!o.json){b.innerHTML='<p>'+esc(o.text||'Sin resultado')+'</p>';return}
    const j=o.json,ok=v=>v===true?'✔':v===false?'✘':'?';
    b.innerHTML=`<div class="kpis"><div class="kpi"><span>Monto leído</span><b>${j.monto==null?'—':money(j.monto)} ${ok(j.coincide_monto)}</b></div><div class="kpi"><span>Esperado</span><b>${money(cuotaOf(x))}</b></div><div class="kpi"><span>Fecha</span><b>${esc(j.fecha||'—')}</b></div><div class="kpi"><span>Destino ${ok(j.coincide_destino)}</span><b style="font-size:.9rem">${esc(j.destino||'—')}</b></div></div>
    <p style="margin-top:10px">${esc(j.resumen||'')}</p>${(j.alertas||[]).map(a=>`<p class="neg">⚠ ${esc(a)}</p>`).join('')}
    <p class="note">La IA solo lee la imagen: no confirma que la plata haya entrado. Chequeá siempre tu cuenta antes de aprobar.</p>`
  }catch(e){b.innerHTML=iaErr}
}

/* 4) Análisis de ventas */
async function iaAnalisis(){
  const b=iaModal('✨ ANÁLISIS DEL NEGOCIO','<p class="note">Analizando tus datos…</p>');
  const by={};S.sales.forEach(s=>{const o=by[s.pname]=by[s.pname]||{ventas:0,total:0,costo:0,cobrado:0,atrasadas:0};o.ventas++;o.total+=s.total;o.costo+=s.cost;o.cobrado+=Math.round(cobrado(s));if(late(s))o.atrasadas++});
  const cuotas={};S.sales.forEach(s=>cuotas[s.n]=(cuotas[s.n]||0)+1);
  try{const r=await ia('analisis',{resumen:{productos:S.products.map(p=>({n:p.name,costo:p.cost,margen:p.margin,stock:p.stock})),ventasPorProducto:by,ventasPorCantidadDeCuotas:cuotas,gastos:S.expenses.reduce((a,e)=>a+e.amount,0),config:{recargoMensual:S.config.recargo,colchon:S.config.colchon,anticipo:S.config.anticipo}}});
    b.innerHTML='<div style="white-space:pre-wrap">'+esc(r.text)+'</div><p class="note">Es una ayuda para pensar, no una verdad: decidís vos.</p>'
  }catch(e){b.innerHTML=iaErr}
}

/* 5) Chat en el catálogo del cliente */
function iaChat(){
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<h2>✨ PREGUNTALE A LA IA</h2><div id="icm" style="max-height:260px;overflow:auto;margin-bottom:8px"></div><div class="row" style="grid-template-columns:1fr auto"><input id="ici" placeholder="Ej: ¿cuál me conviene en 6 cuotas?"><button class="btn g" id="icb" style="margin:0">Enviar</button></div><p class="note">Asistente automático: puede equivocarse. Valen los precios del catálogo.</p>`;
  $('app').insertBefore(c,$('lead'));
  const hist=[],draw=()=>{$('icm').innerHTML=hist.map(m=>`<p style="margin:6px 0;${m.role==='user'?'text-align:right;color:var(--muted)':''}">${esc(m.content)}</p>`).join('');$('icm').scrollTop=1e9};
  const send=async()=>{const t=$('ici').value.trim();if(!t)return;$('ici').value='';hist.push({role:'user',content:t});draw();$('icb').disabled=true;
    try{const r=await ia('chat',{msgs:hist,ap:Number($('cap').value)});hist.push({role:'assistant',content:r.text})}
    catch(e){hist.push({role:'assistant',content:'No pude responder ahora. Escribinos por WhatsApp.'})}
    $('icb').disabled=false;draw()};
  $('icb').onclick=send;$('ici').onkeydown=e=>{if(e.key==='Enter')send()};
}

/* Enganches: agregan los botones de IA después de cada refresh */
function iaHooks(){
  document.querySelectorAll('[data-ds]').forEach(b=>{const x=S.sales.find(v=>v.id===b.dataset.ds);
    if(!x||x.paid>=x.n||b.parentNode.querySelector('[data-ia]'))return;
    b.parentNode.insertBefore(iaBtn('✨ Cobranza','data-ia',()=>iaCobro(x)),b)});
  document.querySelectorAll('[data-ok]').forEach(b=>{if(b.parentNode.querySelector('[data-iar]'))return;
    b.parentNode.insertBefore(iaBtn('✨ Revisar con IA','data-iar',()=>iaComp(b.dataset.ok)),b)});
  const cb=$('cbanner');if(cb&&!cb.querySelector('[data-iah]')){const c=iaBtn('✨ Cobranzas de hoy','data-iah',iaHoy);c.classList.add('g');c.style.marginBottom='6px';cb.appendChild(c)}
  const g=$('gres');if(g&&!g.querySelector('[data-ian]')){const c=iaBtn('✨ Analizar con IA','data-ian',iaAnalisis);c.classList.add('g');g.appendChild(c)}
}
const _refresh=refresh;refresh=function(){_refresh();if(fb&&fb.fn)iaHooks()};
const _catView=catView;catView=function(){_catView();iaChat()};
/* ==================== FIN INTELIGENCIA ARTIFICIAL ==================== */

(async()=>{
  const cm=location.hash==='#catalogo'||/oobCode=/.test(location.search),pm=location.hash.match(/^#pago=(\w+)/);
  if(!FIREBASE_CONFIG){if(cm||pm){$('app').innerHTML='<div class="card">Catálogo no configurado todavía.</div>';return}$('sync').textContent='Solo en este dispositivo (falta Firebase)';build();return}
  try{const B='https://www.gstatic.com/firebasejs/10.12.2/';
    const[A,F,U]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-firestore.js'),import(B+'firebase-auth.js')]);
    const app=A.initializeApp(FIREBASE_CONFIG);fb={fs:F,au:U,db:F.getFirestore(app),auth:U.getAuth(app),fn:!!IA_URL};
  }catch(e){if(cm||pm){$('app').innerHTML='<div class="card">No se pudo conectar.</div>';return}$('sync').textContent='Sin conexión a Firebase';build();return}
  if(pm)return payView(pm[1]);
  if(cm)return catView();
  let subbed=false;
  fb.au.onAuthStateChanged(fb.auth,u=>{
    if(!u||u.phoneNumber||(ADMINS.length&&!ADMINS.includes(u.email))){loginView(u?'Esta cuenta no tiene acceso al panel':'');return}
    $('sync').textContent='● En vivo · '+u.email;$('nav').style.display='';
    if(!subbed){subbed=true;
      ['products','sales','expenses','leads','receipts'].forEach(c=>fb.fs.onSnapshot(fb.fs.collection(fb.db,c),sn=>{S[c]=sn.docs.map(x=>({...x.data(),id:x.id}));refresh()},()=>{$('sync').textContent='Sin permiso o sin conexión'}));
      fb.fs.onSnapshot(fb.fs.doc(fb.db,'config','main'),x=>{if(x.exists()){S.config={...S.config,...x.data()};refresh()}});}
    build();
  });
})();
</script>
